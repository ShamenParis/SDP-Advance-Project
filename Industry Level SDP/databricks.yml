# This is a Declarative Automation Bundle definition for industry_level_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: industry_level_pipeline
  uuid: f6d2351e-8eb3-4d9c-a9e5-b17e2c72f7d9

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-eb4706a8-23c4.cloud.databricks.com
    variables:
      catalog: data_team
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-eb4706a8-23c4.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/aeshantechhub@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/aeshantechhub@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: data_team
      schema: prod
    permissions:
      - user_name: aeshantechhub@gmail.com
        level: CAN_MANAGE
